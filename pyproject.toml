[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-agent"
version = "0.1.0"
description = "Document Q&A agent with token-aware chunking, vector retrieval, and a search loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.0",
    "fastembed>=0.4",
    "tiktoken>=0.8",
    "qdrant-client>=1.12",
    "openai>=1.40",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "rq>=1.16",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fakeredis>=2.20", "reportlab>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/doc_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Multi-service form: the web process enqueues ingestion, a worker consumes it,
# and both address the same Qdrant service. Run with: docker compose up --build
#
# The single-container form is still valid: run the app with neither REDIS_URL
# nor QDRANT_URL and ingestion happens inline.

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      # Published on 6335 so this stack can run alongside another Qdrant that
      # already holds the default 6333. Services talk over the compose network
      # on 6333 regardless, so this mapping is only for inspection from the host.
      - "6335:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  app:
    build: .
    ports:
      - "7860:7860"
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /data/uploads
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # The web process no longer embeds, so it needs no model warm-up.
      WARM_ON_START: "0"
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /data/uploads
      EMBED_BATCH_SIZE: "4"
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    # Scale the workers to consume the queue faster:
    #   docker compose up --scale worker=3
    deploy:
      replicas: 1

volumes:
  qdrant-data:
  uploads:
